apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana                 # Balancea entre los Pods del ReplicaSet
  sessionAffinity: ClientIP      # Mantiene al usuario en el mismo Pod (cada Pod tiene su propia BD de sesiones)
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30300
